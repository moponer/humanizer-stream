name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 规则与检测测试
        run: npm test
      - name: 规则文档不许与规则表脱节
        run: |
          node scripts/gen-rules-doc.mjs
          git diff --exit-code docs/RULES.md
      - name: 样例门禁（AI 腔样本必须被判超阈值，重写样本必须干净）
        run: |
          if node bin/deslop.js check samples/before-zh.md --threshold 40; then
            echo "AI 腔样例没有被判超阈值，检测器退化了"
            exit 1
          fi
          node bin/deslop.js check samples/after-zh.md --threshold 15
